<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cycle">
<meta name="theme-color" content="#1c1917">
<title>Cycle</title>
<style>
  :root { --bg:#fdf6f7; --card:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4; --period:#be123c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --card:#292524; --text:#f5f5f4; --muted:#a8a29e; --line:#44403c; } }
  * { box-sizing:border-box; }
  body { margin:0 auto; padding:16px; max-width:480px; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .status { display:flex; gap:14px; align-items:center; }
  .dot { width:68px; height:68px; border-radius:50%; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; font-size:24px; line-height:1; color:#1c1917; background:var(--line); }
  .dot small { font-size:10px; font-weight:600; margin-top:3px; letter-spacing:.2px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; }
  .between { justify-content:space-between; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:var(--line); color:var(--text); cursor:pointer; }
  button.primary { background:var(--period); color:#fff; }
  input[type=date] { font:inherit; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  input[type=range] { width:100%; }
  .moodval { font-size:24px; font-weight:700; min-width:56px; padding:6px 0; text-align:center; border-radius:10px; color:#1c1917; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dow { text-align:center; font-size:12px; color:var(--muted); }
  .cell { aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#1c1917; position:relative; cursor:pointer; }
  .cell.forecast { opacity:.45; }
  .cell.period { color:#fff; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; background:hsl(0,70%,28%); vertical-align:-1px; }
  .swatch.ov { background:hsl(125,90%,45%); }
  .cell.today { outline:2px solid var(--text); outline-offset:1px; font-weight:700; opacity:1; }
  .cell.empty { background:var(--line); opacity:.4; color:var(--muted); }
  .legend { height:10px; border-radius:5px; margin-top:12px; background:linear-gradient(90deg,hsl(0,85%,68%),hsl(340,70%,72%) 30%,hsl(300,45%,72%) 55%,hsl(255,55%,70%) 78%,hsl(210,100%,56%)); }
  .bg { position:fixed; inset:0; width:100%; height:100%; z-index:-1; opacity:.55; pointer-events:none; }
  @media (prefers-color-scheme: dark) { .bg { opacity:.3; } }
  .card { background:color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  body { background:transparent; }
  html { background:var(--bg); }
  .affirm { text-align:center; padding:18px 20px; }
  .affirm .label { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#c2577a; margin-bottom:6px; }
  .affirm p { margin:0; font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:18px; line-height:1.45; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>

  <div class="card status">
    <div class="dot" id="dot">–</div>
    <div><h1 id="headline">Loading…</h1><div class="muted" id="detail"></div></div>
  </div>

  <div class="card affirm" id="affirm" hidden>
    <div class="label">✿ Today's affirmation</div>
    <p id="affirmText"></p>
  </div>

  <div class="card" id="logcard">
    <div class="row between" style="margin-bottom:12px">
      <strong>Log for</strong><input type="date" id="date">
    </div>
    <div class="row" style="margin-bottom:16px">
      <button class="primary" onclick="act('logPeriodStart')">Period started</button>
      <button onclick="act('logPeriodEnd')">Period ended</button>
    </div>
    <div class="row">
      <div class="moodval" id="moodval">50</div>
      <input type="range" min="1" max="100" value="50" id="mood" oninput="showMood()">
    </div>
    <div class="row between" style="margin-top:8px">
      <span class="muted">Mood (optional) · 1 rough, 100 great</span>
      <button onclick="act('logMood', +$('mood').value)">Save mood</button>
    </div>
  </div>

  <div class="card">
    <div class="row between" style="margin-bottom:10px">
      <button onclick="shift(-1)">‹</button><strong id="month"></strong><button onclick="shift(1)">›</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="muted" id="info" style="margin-top:10px;min-height:20px">Tap a day for details.</div>
    <div class="legend"></div>
    <div class="row between muted" style="font-size:12px;margin-top:4px">
      <span>Rough</span><span><span class="swatch"></span> period · <span class="swatch ov"></span> ovulation · faded = forecast</span><span>Great</span>
    </div>
  </div>
  <div id="toast"></div>
<script src="affirmations.js"></script>

<script>
  // Data lives in a Google Sheet; this page asks the Apps Script for it. The key and mode come from
  // the part of the link after '#', which never leaves the phone (it isn't sent to GitHub).
  const API = 'https://script.google.com/macros/s/AKfycbzPcbrQxOND0asm3en8ku7Ld_fZ_foMFpK_nYCdUccCz3UarTSdX3EPFLl4C4sEmh8i/exec';
  const HASH = new URLSearchParams(location.hash.slice(1));
  const KEY = HASH.get('k') || '';
  const VIEW_ONLY = HASH.get('view') === '1';
  const $ = id => document.getElementById(id);
  if (VIEW_ONLY) $('logcard').remove();
  // Her page only: a new affirmation each day, the same one all day.
  if (!VIEW_ONLY && KEY && window.AFFIRMATIONS && AFFIRMATIONS.length) {
    const d = new Date(), dayOfYear = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);
    $('affirmText').textContent = AFFIRMATIONS[(dayOfYear - 1) % AFFIRMATIONS.length];
    $('affirm').hidden = false;
  }
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth() + 1;
  const pad = n => String(n).padStart(2, '0');
  const localKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const STOPS = [[1, 360, 85, 68], [30, 340, 70, 72], [55, 300, 45, 72], [78, 255, 55, 70], [100, 210, 100, 56]];
  function color(m) {
    for (let i = 1; i < STOPS.length; i++) {
      const a = STOPS[i - 1], b = STOPS[i];
      if (m <= b[0]) { const t = (m - a[0]) / (b[0] - a[0]), x = j => Math.round(a[j] + (b[j] - a[j]) * t); return `hsl(${x(1)},${x(2)}%,${x(3)}%)`; }
    }
  }
  if (!VIEW_ONLY) { $('date').value = localKey(now); showMood(); }

  function showMood() { const v = +$('mood').value; $('moodval').textContent = v; $('moodval').style.background = color(v); }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2200); }
  async function call(fn, params, tries = 3) {
    const q = new URLSearchParams(Object.assign({ fn, k: KEY }, params));
    for (let i = 1; ; i++) {
      try {
        const r = await fetch(API + '?' + q, { credentials: 'omit' });
        const j = await r.json();
        if (!j.ok) throw Object.assign(new Error(j.error || 'Something went wrong'), { final: true });
        return j.data;
      } catch (e) {
        if (e.final || i >= tries) throw e.final ? e : new Error('Could not reach the tracker. Check your connection and try again.');
        await new Promise(res => setTimeout(res, 800 * i)); // Google occasionally hiccups; try again
      }
    }
  }
  function load() { call('getView', { y, m }).then(render).catch(e => toast(e.message)); }
  function shift(d) { m += d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } load(); }
  function act(fn, mood) {
    const params = { date: $('date').value };
    if (mood !== undefined) params.mood = mood;
    toast('Saving…');
    call(fn, params).then(msg => { toast(msg); load(); }).catch(e => toast(e.message));
  }

  function render(v) {
    const s = v.status;
    if (s.empty) {
      $('headline').textContent = s.headline; $('detail').textContent = '';
      $('dot').style.background = ''; $('dot').textContent = '–';
    } else {
      // Circle: days until her period. Headline: which day of her cycle she's on.
      const until = Math.round((Date.parse(s.nextStart) - Date.parse(v.today)) / 864e5);
      const fmt = k => new Date(k + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      let num, cap;
      if (s.onPeriod) { num = s.day; cap = 'period day'; }
      else if (s.late) { num = s.late; cap = s.late === 1 ? 'day late' : 'days late'; }
      else if (until === 0) { num = 0; cap = 'due today'; }
      else { num = until; cap = until === 1 ? 'day left' : 'days left'; }
      $('dot').innerHTML = num + '<small>' + cap + '</small>';
      $('dot').style.background = s.color;
      $('dot').style.color = s.onPeriod ? '#fff' : '';
      $('headline').textContent = 'Cycle day ' + s.day + ' of ~' + s.avgCycle;
      const when = s.onPeriod ? 'Period day ' + s.day : (s.late ? 'Period was due ' : 'Period expected ') + fmt(s.nextStart);
      const mood = s.logged !== null ? 'Mood ' + s.logged + '/100' : 'Mood forecast ' + s.expected + '/100';
      $('detail').textContent = [s.onPeriod ? null : s.phase, when, mood].filter(Boolean).join(' · ');
    }
    $('month').textContent = new Date(y, m - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' });
    const cal = $('cal'); cal.innerHTML = '';
    'SMTWTFS'.split('').forEach(d => cal.insertAdjacentHTML('beforeend', `<div class="dow">${d}</div>`));
    for (let i = 0; i < v.startDow; i++) cal.insertAdjacentHTML('beforeend', '<div></div>');
    v.days.forEach((d, i) => {
      const el = document.createElement('div');
      el.className = 'cell' + (d.empty ? ' empty' : '') + (d.onPeriod ? ' period' : '') + (d.predicted ? ' predicted' : '') +
        (!d.empty && d.logged === null ? ' forecast' : '') + (d.isToday ? ' today' : '');
      if (!d.empty) el.style.background = d.color;
      el.textContent = i + 1;
      el.onclick = () => pick(d);
      cal.appendChild(el);
    });
  }

  function pick(d) {
    if (!VIEW_ONLY && !d.future) $('date').value = d.date;
    $('info').textContent = d.empty ? d.date + ': no data yet' :
      `${d.date}: cycle day ${d.day} · ${d.phase} · mood ${d.logged !== null ? d.logged + ' (logged)' : d.expected + ' (forecast)'}`;
    if (!VIEW_ONLY && d.logged !== null) { $('mood').value = d.logged; showMood(); }
  }

  if (!KEY) { $('headline').textContent = 'Open this page from your private link'; if ($('logcard')) $('logcard').remove(); }
  else load();
</script>
</body>
